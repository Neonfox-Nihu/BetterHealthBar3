name: Build BetterHealthBar jar
-- fork-only build workflow, uploads dist shadowJar

on:
  push:
    branches: ["master"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle
    - name: Grant execute permission
      run: chmod +x gradlew
    - name: Build shadowJar
      run: ./gradlew :dist:shadowJar -x test --console=plain
    - name: Upload jar
      uses: actions/upload-artifact@v4
      with:
        name: bhb-jar
        path: dist/build/libs/*
        if-no-files: error