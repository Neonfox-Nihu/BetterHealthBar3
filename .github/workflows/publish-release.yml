name: Publish fork jar release
on:
  push:
    branches: ["master"]
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: Build
        run: chmod +x gradlew && ./gradlew :dist:shadowJar -x test --console=plain
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          ls -la dist/build/libs build/libs || true
          JAR=$(ls -1 build/libs/BetterHealthBar-*.jar 2>/dev/null | head -1)
          [ -z "$JAR" ] && JAR=$(ls -1 dist/build/libs/*.jar | grep -viE 'sources|javadoc' | head -1)
          echo "JAR=$JAR"
          cp "$JAR" BetterHealthBar-26.3.jar
          gh release delete bh-fork --yes 2>/dev/null || true
          gh release create bh-fork BetterHealthBar-26.3.jar --title "BetterHealthBar 26.3 fork build" --notes "built from master"

