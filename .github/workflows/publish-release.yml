name: Publish fork jar release
on:
  push:
    branches: ["master"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle
      - name: Grant execute permission
        run: chmod +x gradlew
      - name: Build shadowJar
        run: ./gradlew :dist:shadowJar -x test --console=plain
      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=bh-build-${{GITHUB_SHA::8}}
          gh release delete "$TAG" --yes 2>/dev/null || true
          gh release create "$TAG" dist/build/libs/*.jar --title "BetterHealthBar 4.2.0 fork" --notes "26.3 compat build"
